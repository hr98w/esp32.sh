name: 提交项目 / Submit a project
description: 推荐 ESP32 开源项目，无需写代码。Recommend an ESP32 project; no code required.
title: "[Project submission] "
labels:
  - submission:project
body:
  - type: markdown
    attributes:
      value: |-
        只需填写 GitHub 仓库链接，维护者会核验并整理收录。可以推荐自己或别人的项目。
        Just share the GitHub repository link. Maintainers will verify and prepare the listing. You may recommend your own project or someone else’s.
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库链接 / Repository URL
      description: 公开仓库，例如 / Public repository, e.g. https://github.com/owner/project
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 为什么推荐？/ Why recommend it?
      placeholder: "选填：它能做什么？/ Optional: what can it do?"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: 使用过什么设备？/ Device you tried
      placeholder: "选填：实际使用的型号，没试过可留空。/ Optional: the model you used; leave blank if untested."
    validations:
      required: false
