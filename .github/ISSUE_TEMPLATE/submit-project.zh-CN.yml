name: 提交项目
description: 推荐 ESP32 开源项目，无需写代码或 Markdown。
title: "[Project submission] "
labels:
  - submission:project
body:
  - type: markdown
    attributes:
      value: 填写 GitHub 仓库链接即可。维护者会核验项目并整理收录资料，可以推荐自己的项目，也可以推荐别人的。
  - type: input
    id: repository
    attributes:
      label: GitHub 仓库链接
      description: 公开的 GitHub 仓库，例如 https://github.com/owner/project。
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 为什么推荐？
      placeholder: 选填：它能做什么，有什么有趣之处？
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: 使用过什么设备？
      placeholder: 选填：写下实际使用的型号；没试过可以留空。
    validations:
      required: false
