const languages=[{code:"zh",name:"中文",html:"zh-CN"},{code:"en",name:"English",html:"en"},{code:"ja",name:"日本語",html:"ja"}];
const demoDataDate="2026-10-16";
// Set this when the website repository is created; never use an unrelated repository.
const siteRepositoryUrl=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deviceUI={query:'',open:false,expanded:new Set(['M5Stack'])};
const deviceAliases={stick:'stickc stick c plus 2 棒',wave:'waveshare 微雪 amoled 1.8',card:'m5 card puter 键盘',lily:'lilygo tdisplay t display s3',watch:'m5 stop watch stopwatch 手表 腕時計',paper:'lilygo t5 epaper e paper 墨水屏 电子纸 電子ペーパー',xiao:'seeed studio 矽递 小 晓',devkit:'espressif 乐鑫 dev kit 开发板'};
const normalizeDeviceSearch=value=>value.toLowerCase().replace(/[\s\-_.\/]+/g,'');
const state={lang:'zh',page:'projects',model:null,device:'all',category:'all',brand:'all',chip:'all',feature:'all',query:'',sort:'stars',deviceSort:'count'};
const t=key=>strings[state.lang][key];
const label=values=>values[languages.findIndex(l=>l.code===state.lang)]||values[1];
const getDevice=id=>devices.find(d=>d.id===id);
const deviceName=id=>getDevice(id)?.name||id;
const formatStars=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);
function routeHref(page,opts={}){const p=new URLSearchParams();if(state.lang!=='zh')p.set('lang',state.lang);if(page!=='device'){if(opts.device&&opts.device!=='all')p.set('device',opts.device);if(opts.brand&&opts.brand!=='all')p.set('brand',opts.brand);if(opts.chip&&opts.chip!=='all')p.set('chip',opts.chip);if(opts.feature&&opts.feature!=='all')p.set('feature',opts.feature);if(opts.category&&opts.category!=='all')p.set('category',opts.category);if(opts.query)p.set('q',opts.query)}if(opts.sort&&opts.sort!=='stars')p.set('sort',opts.sort);const path=page==='device'?'devices/'+opts.model:page;return '#/'+path+(p.size?'?'+p:'')}
function currentHref(){return routeHref(state.page,{...state,sort:state.page==='devices'?state.deviceSort:state.sort})}
function writeUrl(replace=true){const url=location.pathname+currentHref();try{history[replace?'replaceState':'pushState']({esp32Demo:true},'',url)}catch{location.hash=currentHref()}}
function readRoute(){closeDevicePicker(false);const hash=location.hash||'';const [path,search='']=hash.replace(/^#\/?/,'').split('?');const legacy=new URLSearchParams(location.search);const p=hash?new URLSearchParams(search):legacy;const parts=path.split('/').filter(Boolean);state.page=parts[0]==='devices'?(parts[1]?'device':'devices'):'projects';if(!hash&&legacy.get('tab')==='devices')state.page='devices';state.model=state.page==='device'?parts[1]:null;if(state.page==='device'&&!getDevice(state.model)){state.page='devices';state.model=null}state.lang=languages.some(l=>l.code===p.get('lang'))?p.get('lang'):'zh';state.device=getDevice(p.get('device'))?p.get('device'):'all';state.category=categories.some(c=>c.id===p.get('category'))?p.get('category'):'all';state.brand=['M5Stack','Waveshare','LILYGO','Seeed','Espressif'].includes(p.get('brand'))?p.get('brand'):'all';state.chip=['ESP32','ESP32-S3'].includes(p.get('chip'))?p.get('chip'):'all';state.feature=['screen','touch','audio','keyboard','imu','epaper','gpio'].includes(p.get('feature'))?p.get('feature'):'all';state.query=p.get('q')||'';state.sort=['stars','newest','updated'].includes(p.get('sort'))?p.get('sort'):'stars';state.deviceSort=p.get('sort')==='name'?'name':'count';$('search').value=state.query;translate(false);render()}
function navigate(page,opts={}){closeDevicePicker(false);deviceUI.query='';$('deviceSearch').value='';state.page=page;state.model=opts.model||null;state.query='';state.device='all';state.category='all';state.brand='all';state.chip='all';state.feature='all';Object.assign(state,opts);$('search').value=state.query;writeUrl(false);render();window.scrollTo?.({top:0,behavior:'instant'})}
function persistRender(){writeUrl();render()}
function matchesBase(p){return(state.device==='all'||p.devices.includes(state.device))&&(state.brand==='all'||p.devices.some(id=>getDevice(id).brand===state.brand))}
function filteredProjects(){const q=state.query.trim().toLowerCase();const list=state.page==='device'?projects.filter(p=>p.devices.includes(state.model)):projects.filter(p=>matchesBase(p)&&(state.category==='all'||p.category===state.category)&&(!q||[p.name,p.author,...p.description,...p.devices.map(id=>{const d=getDevice(id);return d.name+' '+(d.full||'')+' '+d.brand})].join(' ').toLowerCase().includes(q)));return list.sort((a,b)=>state.sort==='stars'?b.stars-a.stars:state.sort==='newest'?b.added-a.added:b.date.localeCompare(a.date))}
function artHtml(p,index=''){return `<div class="project-art" style="--artbg:${p.color}"><span class="art-tag">${p.tag||p.brand||'HARDWARE FILE'}</span>${artwork(p.art)}<span class="art-index">${index?String(index).padStart(3,'0'):''} / ESP32.SH</span></div>`}
function renderDeviceSidebar(){
  const q=normalizeDeviceSearch(deviceUI.query);
  const available=devices.map(d=>({...d,count:projects.filter(p=>p.devices.includes(d.id)).length})).filter(d=>d.count>0);
  const matching=available.filter(d=>!q||normalizeDeviceSearch([d.name,d.full||'',d.brand+' '+d.name,deviceAliases[d.id]||''].join(' ')).includes(q));
  const brands=[...new Set(available.map(d=>d.brand))];
  const option=(id,name,count)=>`<button class="device-option ${state.device===id?'active':''}" data-filter-device="${id}" aria-pressed="${state.device===id}"><span class="device-model">${esc(name)}</span><span class="device-count" aria-label="${count} ${t('items')}">${count}</span></button>`;
  $('deviceTree').innerHTML=option('all',t('allDevices'),projects.length)+brands.map(brand=>{
    const list=matching.filter(d=>d.brand===brand).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
    if(!list.length)return '';
    return `<details class="device-group" data-device-group="${esc(brand)}"${q||deviceUI.expanded.has(brand)?' open':''}><summary>${esc(brand)}</summary><div class="device-group-models">${list.map(d=>option(d.id,d.name,d.count)).join('')}</div></details>`;
  }).join('')+(!matching.length?`<p class="device-no-results" role="status">${t('deviceEmpty')}<br><button class="text-action" data-contribute>${t('missingEntry')}</button></p>`:'');
  $('deviceSearch').placeholder=t('deviceSearch');$('deviceSearch').setAttribute('aria-label',t('deviceFilterSearch'));
  $('deviceDirectoryLink').href=routeHref('devices');
  $('devicePickerToggle').textContent=(state.device==='all'?t('changeDevice'):deviceName(state.device))+' ▾';
  ['closeDeviceSidebar','deviceSidebarBackdrop'].forEach(id=>$(id).setAttribute('aria-label',t('closeDeviceFilter')));
}
function setDevicePicker(open,restoreFocus=true){
  deviceUI.open=open;$('workspace').classList.toggle('device-picker-open',open);
  $('devicePickerToggle').setAttribute('aria-expanded',String(open));$('deviceSidebarBackdrop').hidden=!open;
  if(open)$('deviceSearch').focus();else if(restoreFocus)$('devicePickerToggle').focus();
}
function closeDevicePicker(restoreFocus=true){setDevicePicker(false,restoreFocus)}

function projectCard(p,i){return `<article class="project-card"><a class="art-link" href="${p.repositoryUrl}" target="_blank" rel="noopener noreferrer" aria-label="${p.name} — ${t('example')}: ${p.repoExample}">${artHtml(p,i+1)}</a><div class="card-body"><div class="card-heading"><h2 class="card-name"><a class="card-main-link" href="${p.repositoryUrl}" target="_blank" rel="noopener noreferrer" title="${t('example')}: ${p.repoExample}">${p.name}</a></h2><span class="type-icon" title="${categories.find(c=>c.id===p.category)[state.lang]}"></span></div><div class="card-author">${t('author')} ${p.author}</div><p class="card-description">${label(p.description)}</p><div class="card-device-tags">${p.devices.map(id=>`<a class="device-tag" href="${routeHref('device',{model:id})}" data-open-device="${id}">${esc(deviceName(id))}</a>`).join('')}</div><div class="demo-source" title="${t('example')}: ${p.repoExample}">${t('example')}: ${p.repoExample}</div><div class="card-footer"><div class="card-footer-left"><span class="star">${icon('star',11)} ${formatStars(p.stars)}</span><span>${p.license}</span></div><a class="open-project" href="${p.repositoryUrl}" target="_blank" rel="noopener noreferrer">GitHub ${icon('arrow',10)}</a></div></div></article>`}
function deviceCard(d){const n=projects.filter(p=>p.devices.includes(d.id)).length;return `<article class="project-card device-card"><a class="art-link" href="${routeHref('device',{model:d.id})}" data-open-device="${d.id}" aria-label="${t('viewDevice')} ${d.name}">${artHtml(d)}</a><div class="card-body"><div class="card-author">${d.brand} / ${d.chip}</div><h2 class="card-name" style="margin-top:8px"><a href="${routeHref('device',{model:d.id})}" data-open-device="${d.id}">${d.name}</a></h2><p class="card-description">${label(d.feature)}</p><div class="card-device-tags">${deviceMeta[d.id].features.map(f=>`<span class="device-tag">${t(f)}</span>`).join('')}</div><div class="hardware-caption">${deviceMeta[d.id].price} · ${t('priceExample')}</div></div><a class="device-action raised" href="${routeHref('device',{model:d.id})}" data-open-device="${d.id}"><span>${t('viewDeviceProjects')}</span><span>${n} ${t('items')} ↗</span></a></article>`}
function renderDeviceDetail(){const d=getDevice(state.model),m=deviceMeta[d.id];$('deviceDetail').innerHTML=`<a class="detail-back" href="${routeHref('devices')}" data-route="devices">← ${t('backDevices')}</a><div class="device-overview">${artHtml(d)}<div><div class="device-heading-line">${d.brand} / ${d.chip}</div><h1>${d.name}</h1><p class="device-description">${label(m.description)}</p><div class="device-specs"><div class="spec-item"><span>${t('chip')}</span><strong>${d.chip}</strong></div><div class="spec-item"><span>${t('memory')}</span><strong>${m.flash}</strong></div><div class="spec-item"><span>${t('feature')}</span><strong>${m.features.map(t).join(' / ')}</strong></div><div class="spec-item"><span>${t('price')}</span><strong>${m.price}</strong></div></div><div class="device-links"><a class="raised" href="${m.url}" target="_blank" rel="noopener noreferrer">${t('makerSite')} ↗</a></div><p class="device-price-note">${t('priceNote')} ${t('dataDate')}: ${demoDataDate}</p></div></div><p class="detail-note">${t('deviceNote')} <button class="text-action" data-contribute>${t('correction')}</button></p><div class="related-header"><h2>${t('relatedProjects')}</h2><p>${t('relatedHint')}</p></div>`}
function fillSelect(id,options,value){$(id).innerHTML=options.map(([v,l])=>`<option value="${v}"${v===value?' selected':''}>${l}</option>`).join('')}
function renderHardwareFilters(){fillSelect('makerFilter',[['all',t('allBrands')],...[...new Set(devices.map(d=>d.brand))].map(b=>[b,b])],state.brand);fillSelect('chipFilter',[['all',t('allChips')],['ESP32','ESP32'],['ESP32-S3','ESP32-S3']],state.chip);fillSelect('featureFilter',[['all',t('allFeatures')],...['screen','touch','audio','keyboard','imu','epaper','gpio'].map(f=>[f,t(f)])],state.feature)}
function render(){
  document.querySelector('.logo').setAttribute('href',routeHref('projects'));
  const detail=state.page==='device',hardware=state.page==='devices',projectPage=!detail&&!hardware;
  $('deviceDetail').hidden=!detail;$('directoryIntro').hidden=detail;$('searchRow').hidden=detail;
  $('hardwareFilters').hidden=!hardware;$('categories').hidden=!projectPage;$('deviceSidebar').hidden=state.page!=='projects';$('devicePickerToggle').hidden=state.page!=='projects';$('workspace').classList.toggle('with-device-sidebar',state.page==='projects');
  document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===(detail?'devices':state.page);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(state.device!=='all')deviceUI.expanded.add(getDevice(state.device).brand);renderDeviceSidebar();$('search').placeholder=t(hardware?'hardwareSearch':'search');$('search').value=state.query;
  $('headline').textContent=t(hardware?'deviceHeadline':'headline');
  $('introDescription').textContent=t(hardware?'deviceIntro':'intro');
  $('categories').innerHTML=categories.map(c=>`<button class="category ${state.category===c.id?'active':''}" data-category="${c.id}" aria-pressed="${state.category===c.id}">${c[state.lang]}</button>`).join('');
  let count=0;
  if(hardware){
    renderHardwareFilters();const q=state.query.trim().toLowerCase();
    const ds=devices.filter(d=>(state.brand==='all'||state.brand===d.brand)&&(state.chip==='all'||state.chip===d.chip)&&(state.feature==='all'||deviceMeta[d.id].features.includes(state.feature))&&(!q||[d.name,d.full||'',d.brand,d.chip,...d.feature,...deviceMeta[d.id].features.map(t)].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.deviceSort==='name'?a.name.localeCompare(b.name):projects.filter(p=>p.devices.includes(b.id)).length-projects.filter(p=>p.devices.includes(a.id)).length);
    count=ds.length;$('projectGrid').innerHTML=ds.map(deviceCard).join('');$('resultTitle').textContent=t('allHardware');
    fillSelect('sort',[['count',t('deviceSort')[0]],['name',t('deviceSort')[1]]],state.deviceSort);
  }else{
    if(detail)renderDeviceDetail();const list=filteredProjects();count=list.length;$('projectGrid').innerHTML=list.map(projectCard).join('');
    const title=state.device!=='all'?deviceName(state.device):t('allProjects');
    $('resultTitle').innerHTML=detail?'':esc(title)+(state.device!=='all'?`<a class="result-title-link" href="${routeHref('device',{model:state.device})}" data-open-device="${state.device}">${t('moreInfo')} ↗</a>`:'');
    fillSelect('sort',[['stars',t('sort')[0]],['newest',t('sort')[1]],['updated',t('sort')[2]]],state.sort);
  }
  if(!count)$('projectGrid').innerHTML=`<div class="empty-state">${icon('chip',30)}<h2>${t('emptyTitle')}</h2><p>${t('emptyText')}</p><button class="raised" data-reset>${t('showAll')}</button><button class="text-action empty-contribute" data-contribute>${t('missingEntry')}</button></div>`;
  $('resultCount').textContent=count+' '+t(hardware?'deviceItems':'items');
  $('reset').hidden=detail||(!state.query&&state.device==='all'&&state.category==='all'&&state.brand==='all'&&state.chip==='all'&&state.feature==='all');
  $('statusText').textContent=`${count} ${t(hardware?'deviceItems':'items')}`;
  const title=detail?deviceName(state.model):t(hardware?'devices':'projects');
  $('windowTitle').textContent='esp32.sh — '+title;document.title=(detail?deviceName(state.model)+' — ':'')+'esp32.sh';
}
function translate(shouldRender=true){
  document.documentElement.lang=languages.find(l=>l.code===state.lang).html;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.getAttribute('data-i18n')));
  fillSelect('language',languages.map(l=>[l.code,l.name]),state.lang);
  $('language').setAttribute('aria-label',t('languageLabel'));
  document.querySelector('.main-nav').setAttribute('aria-label',t('mainNavLabel'));
  [['content','contentLabel'],['search','searchLabel'],['categories','categoriesLabel'],['sort','sortLabel'],['makerFilter','makerLabel'],['chipFilter','chipLabel'],['featureFilter','featureLabel']].forEach(([id,key])=>$(id).setAttribute('aria-label',t(key)));
  $('closeDialog').setAttribute('aria-label',t('close'));
  document.querySelector('.demo-status').textContent=t('demoLabel')+' · '+demoDataDate;
  if(shouldRender)persistRender();
}

function selectDevice(id){if(id!=='all'&&!getDevice(id))return;closeDevicePicker();if(state.page==='device'||state.page==='devices')navigate('projects',{device:id});else{state.device=id;state.brand='all';persistRender()}}
function resetFilters(){if(state.page==='device'){navigate('projects');return}state.device='all';state.category='all';state.brand='all';state.chip='all';state.feature='all';state.query='';deviceUI.query='';$('deviceSearch').value='';persistRender()}
function showDialog(title,content){$('dialogTitle').textContent=title;$('dialogContent').innerHTML=content;$('dialog').showModal()}
function repositoryAction(text,path=''){
  return siteRepositoryUrl?`<a class="modal-action raised" href="${siteRepositoryUrl+path}" target="_blank" rel="noopener noreferrer">${text}</a>`:`<p class="repository-pending">${t('repoPending')}</p>`;
}
function showAbout(){showDialog(t('about'),`<h2>${t('aboutTitle')}</h2><p>${t('aboutText')}</p><h3>${t('rulesTitle')}</h3><ul class="policy-list"><li>${t('ruleLicense')}</li><li>${t('ruleHardware')}</li><li>${t('ruleFreshness')}</li></ul><h3>${t('sourceTitle')}</h3><p>${t('sourceText')}</p>${repositoryAction('GitHub ↗')}<div class="modal-meta">${t('aboutNote')}<br>${t('dataDate')}: ${demoDataDate}</div><button class="modal-action raised" data-close-dialog>${t('close')}</button>`)}
function showSubmit(){closeDevicePicker(false);showDialog(t('submit'),`<h2>${t('submitTitle')}</h2><p>${t('submitText')}</p><ul class="policy-list"><li>${t('submitProject')}</li><li>${t('submitDevice')}</li><li>${t('submitCorrection')}</li></ul><p>${t('submitHow')}</p>${repositoryAction(t('openGitHub'),'/issues/new/choose')}<div class="modal-meta">${t('submitNote')}</div><button class="modal-action raised" data-close-dialog>${t('close')}</button>`)}

function plainClick(e){return !e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&e.button===0}
document.addEventListener('click',e=>{const target=e.target.closest?.('button,a');if(!target)return;const open=target.dataset.openDevice;if(open&&plainClick(e)){e.preventDefault();navigate('device',{model:open});return}if(target.dataset.route&&plainClick(e)){e.preventDefault();navigate(target.dataset.route);return}if(target.dataset.nav){navigate(target.dataset.nav);return}if(target.dataset.filterDevice){selectDevice(target.dataset.filterDevice);return}if(target.dataset.brand){state.brand=target.dataset.brand;state.device='all';persistRender();return}if(target.dataset.category){state.category=target.dataset.category;persistRender();return}if(target.hasAttribute('data-contribute')){showSubmit();return}if(target.hasAttribute('data-reset'))resetFilters();if(target.hasAttribute('data-close-dialog'))$('dialog').close()});
$('search').addEventListener('input',e=>{state.query=e.target.value;persistRender()});
$('deviceSearch').addEventListener('input',e=>{deviceUI.query=e.target.value;renderDeviceSidebar()});
$('deviceTree').addEventListener('toggle',e=>{const brand=e.target.dataset.deviceGroup;if(!brand||deviceUI.query)return;if(e.target.open)deviceUI.expanded.add(brand);else deviceUI.expanded.delete(brand)},true);
$('devicePickerToggle').addEventListener('click',()=>setDevicePicker(!deviceUI.open));
$('closeDeviceSidebar').addEventListener('click',()=>closeDevicePicker());
$('deviceSidebarBackdrop').addEventListener('click',()=>closeDevicePicker());
$('sort').addEventListener('change',e=>{if(state.page==='devices')state.deviceSort=e.target.value;else state.sort=e.target.value;persistRender()});
['makerFilter','chipFilter','featureFilter'].forEach((id,i)=>$(id).addEventListener('change',e=>{state[['brand','chip','feature'][i]]=e.target.value;persistRender()}));
$('reset').addEventListener('click',resetFilters);
$('language').addEventListener('change',e=>{state.lang=languages.some(l=>l.code===e.target.value)?e.target.value:'zh';translate()});
$('closeDialog').addEventListener('click',()=>$('dialog').close());$('about').addEventListener('click',showAbout);$('submit').addEventListener('click',showSubmit);$('github').addEventListener('click',()=>siteRepositoryUrl?window.open(siteRepositoryUrl,'_blank','noopener,noreferrer'):showSubmit());
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&deviceUI.open){closeDevicePicker();return}if(e.key==='Tab'&&deviceUI.open&&window.matchMedia?.('(max-width:800px)').matches){const elements=[...$('deviceSidebar').querySelectorAll('button,input,summary,a')].filter(el=>!el.closest('details')||el.tagName==='SUMMARY'||el.closest('details').open);const first=elements[0],last=elements[elements.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!$('dialog').open&&state.page!=='device'){e.preventDefault();$('search').focus()}});
window.addEventListener('hashchange',readRoute);window.addEventListener('popstate',readRoute);readRoute();writeUrl();
</script>
</body>
</html>
